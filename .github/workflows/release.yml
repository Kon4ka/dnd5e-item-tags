name: Release Foundry module

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

# Do not cancel queued pushes: each run gets its own immutable version.
# GitHub chooses latest by release date / semantic version, not completion order.
jobs:
  release:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test module
        run: npm test
      - name: Test packaging
        run: python3 -m unittest discover -s tests -p 'test_release.py' -v
      - name: Build manifest, ZIP and changelog
        run: python3 tools/release.py build
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/release.py publish
